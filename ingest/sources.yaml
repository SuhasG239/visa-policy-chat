# Every knowledge-base source. Fetchers read this file; nothing is hardcoded elsewhere.
# Only official government sources belong here.

http:
  user_agent: "visa-policy-chat/0.1 (local research tool for U.S. immigration rules; polite client)"
  request_delay_seconds: 1.0
  timeout_seconds: 60

sources:
  # --- eCFR (https://www.ecfr.gov/developers/documentation/api/v1) ---
  - id: ecfr-8-214.1
    type: ecfr
    title: "8"
    part: "214"
    section: "214.1"
    scope: [f1, nonimmigrant, status]

  - id: ecfr-8-214.2-f
    type: ecfr
    title: "8"
    part: "214"
    section: "214.2"
    paragraph: f            # keep only paragraph (f): F-1 students
    scope: [f1]
    # Extra tags for (f)(n) paragraphs, keyed "<paragraph>-<n>".
    paragraph_scope:
      f-1: [admission, travel]
      f-2: [status]
      f-3: [f2]
      f-4: [travel]
      f-5: [period_of_stay, grace_period]
      f-6: [status, course_load]
      f-7: [extension]
      f-8: [transfer]
      f-9: [employment, on_campus]
      f-10: [employment, cpt, opt, stem_opt]
      f-11: [employment, opt]
      f-12: [opt, stem_opt, reporting]
      f-13: [travel, opt]
      f-14: [employment]
      f-15: [f2]
      f-16: [reinstatement]
      f-17: [reporting]
      f-18: [border_commuter]
      f-19: [fees]

  - id: ecfr-8-248
    type: ecfr
    title: "8"
    part: "248"
    scope: [f1, change_of_status]

  # --- Federal Register (https://www.federalregister.gov/developers/documentation/api/v1) ---
  # New and proposed rules that touch the phase 1 regulations. Final rules drop out
  # once eCFR carries them; proposals drop out when a final rule shares their RIN.
  - id: federal-register-f1
    type: federal_register
    agencies:
      - homeland-security-department
      - u-s-citizenship-and-immigration-services
      - u-s-immigration-and-customs-enforcement
      - state-department
    cfr_title: 8
    cfr_parts: ["214", "248"]
    document_types: [RULE, PRORULE]
    published_since: "2024-01-01"
    final_rule_window_days: 365   # keep final rules this long after publication, or until effective
    # Keep a document only if its title or abstract mentions one of these (case-insensitive).
    include_terms: ["F-1", "F, J", "student", "practical training", "214.1", "248"]
    scope: [f1]
    term_scope:
      practical training: [opt]
      grace period: [grace_period]
      fixed time period: [period_of_stay]
      extension: [extension]

  # --- USCIS (no API; HTML pages). uscis.gov robots.txt asks for Crawl-delay: 10. ---
  - id: uscis-pm-v2-pF
    type: uscis_pm
    name: USCIS Policy Manual, Vol. 2, Part F
    url: https://www.uscis.gov/policy-manual/volume-2-part-f
    chapter_url: https://www.uscis.gov/policy-manual/volume-2-part-f-chapter-{n}
    chapters: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    request_delay_seconds: 10
    skip_headings: ["M-1"]          # Part F also covers M-1 students; phase 1 is F-1 only
    scope: [f1]
    chapter_scope:
      3: [status, course_load]
      4: [transfer]
      5: [cpt, opt, stem_opt]
      6: [employment, on_campus, off_campus_work]
      7: [travel]
      8: [change_of_status, extension, period_of_stay]
      9: [f2]
    # Policy alerts are read from each chapter's Updates tab; keep substantive F-1 ones.
    alert_include_terms: ["F-1", "student", "practical training", "OPT"]

  - id: uscis-alerts-f1
    type: uscis_alert
    url: https://www.uscis.gov/newsroom/alerts
    max_pages: 8                     # 10 alerts per page, newest first
    request_delay_seconds: 10
    include_terms: ["F-1", "student", "OPT", "practical training", "SEVP", "SEVIS", "Form I-20"]
    court_order_terms: ["court order", "injunction", "enjoin", "enjoining", "vacated", "vacatur", "court decision", "stay"]
    # A court order is kept only if its text also reaches benefit requests F-1 students file.
    court_order_relevance_terms: ["benefit application", "benefit applications", "benefit request", "benefit requests",
                                  "adjudicate applications", "immigration applications", "agency-wide",
                                  "extension of stay", "change of status", "I-539", "nonimmigrant student", "F-1"]
    scope: [f1]
